name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-dependencies:
    name: Node dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit HIGH/CRITICAL gate
        run: node scripts/validate-npm-audit-exceptions.mjs --run

      - name: OWASP CVE Lite HIGH/CRITICAL gate
        run: node scripts/validate-cve-audit-exceptions.mjs --run

      - name: Audit exception fail-closed regression tests
        run: node --test scripts/test-npm-audit-exceptions.mjs scripts/test-audit-gate-runtime.mjs

  repository-scan:
    name: Trivy repository scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy HIGH/CRITICAL gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table

  semgrep:
    name: Semgrep static analysis report
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # TODO: Review initial findings before turning Semgrep into a blocking gate.
      - name: Semgrep CE report-only scan
        run: semgrep scan --config auto .
