name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-dependencies:
    name: Node dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm for reviewed audit representation
        run: npm install --global --ignore-scripts npm@10.9.4

      - name: Assert the actual audit npm executable
        run: node scripts/assert-pinned-npm.mjs

      - name: Install dependencies
        run: npm ci

      - name: npm audit HIGH/CRITICAL gate
        run: node scripts/validate-npm-audit-exceptions.mjs --run

      - name: OWASP CVE Lite HIGH/CRITICAL gate
        run: node scripts/validate-cve-audit-exceptions.mjs --run

      - name: Audit exception fail-closed regression tests
        run: node --test scripts/test-npm-audit-exceptions.mjs scripts/test-audit-gate-runtime.mjs scripts/test-pinned-npm-runtime.mjs scripts/test-trivy-audit-exceptions.mjs

  repository-scan:
    name: Trivy repository scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Same setup action already used by trivy-action@v0.36.0, pinned exactly.
      - name: Setup reviewed Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0

      - name: Trivy raw HIGH/CRITICAL exception gate
        run: node scripts/validate-trivy-audit-exceptions.mjs --run

  semgrep:
    name: Semgrep static analysis report
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # TODO: Review initial findings before turning Semgrep into a blocking gate.
      - name: Semgrep CE report-only scan
        run: semgrep scan --config auto .
